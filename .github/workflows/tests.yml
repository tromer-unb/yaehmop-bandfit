name: Lightweight I/O tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python front-end dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fast pure-Python I/O tests only
        run: python -m unittest discover -s tests -p 'test_*.py' -v
# Deliberately NO: YAeHMOP C build, DFT, PySCF, native band calculations,
# parameter optimization, external band downloads, or artifact uploads.
