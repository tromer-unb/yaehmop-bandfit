# MoS2 monolayer: 1 VB + 1 CB of a PBE calculation (FHI-aims, validation/aims/MoS2_monolayer_pbe)
# drawn as an ordinary band picture; used for the screenshots of the graphical interface
[reference]
image = MoS2_PBE_2bands.png
mode = auto
emin = -3
emax = 3.5

[band_path]
dimension = 2
points = 0,0; 0.666666,-0.3333333; 0.3333333,-0.666666; 0,0
labels = G,K,K',G
points_per_segment = 20

[fit]
name = MoS2_from_picture
n_pairs = 1
budget = 4000
optimizer = cmaes
polish = nelder-mead
basis_add = auto
