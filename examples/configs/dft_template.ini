# Fit EHT parameters to the RAW eigenvalues of a DFT band-structure calculation.
# Command line equivalent:  --dft-dir FOLDER --dft-code vasp|qe|siesta|aims
[reference]
# Folder of the band-structure run (relative to this file) and its package
dft_dir = path/to/bands
dft_code = vasp
# Optional: main band file when the folder has several, e.g. vasprun.xml or si.bands
# dft_file = vasprun.xml
# Optional: occupied DFT bands if the automatic count (electrons/occupations/Fermi) is wrong
# valence_bands = 13
# Energy window of the full comparison figure, relative to midgap (eV)
emin = -6
emax = 6

[band_path]
# Optional for DFT references: periodic dimension (default: detected from vacuum)
# dimension = 2
# YAeHMOP points per straight segment of the DFT path
points_per_segment = 20

[fit]
# window (DFT default): all bands in an energy window, weighted toward E_F; frontier: n_pairs bands only
objective = window
# extra EHT shells, e.g. "S:d H:p" or auto
# basis_add = auto
n_pairs = 1
budget = 200
optimizer = nelder-mead
gap_weight = 0.35
reg_weight = 0.04

# Optional weights of the window objective (defaults shown)
# [objective]
# window_min = -6
# window_max = 4
# energy_scale = 2.0
# far_weight = 0.05
# w_frontier = 3
# w_gap_indirect = 5
# w_gap_direct = 3
# w_vbm = 4
# w_cbm = 4
# w_high_symmetry = 4
# w_extrema = 4
# w_position = 2
