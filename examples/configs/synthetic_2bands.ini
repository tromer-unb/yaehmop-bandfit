# DEMONSTRATION ONLY: toy bands, NOT DFT
[reference]
image = ../synthetic/toy_2bands.csv
mode = csv
emin = -3.5
emax = 3.5
trace_nx = 151
min_coverage = 0.75

[band_path]
dimension = 2
points = 0,0; 0.5,0; 0.3333333333,0.3333333333; 0,0
labels = G,M,K,G
points_per_segment = 20

[fit]
n_pairs = 1
budget = 200
optimizer = nelder-mead
gap_weight = 0.35
reg_weight = 0.04
