# In2S2, third round: CB3 and above are delocalized (only ~0.27 of the charge inside the
# atomic spheres in the PROCAR, against 0.4-0.5 for VB1-3, CB1, CB2) and are left out.
[reference]
emin = -6
emax = 6

[band_path]
points_per_segment = 15

[fit]
objective = window
n_pairs = 1
budget = 3000
optimizer = cmaes
polish = nelder-mead
start_from = ../vasp/In2S2_monolayer_pbe/fitting/window-cmaes

[objective]
window_max = 4
n_cond = 2
band_weights = v1:10 v2:6 v3:4 c1:12 c2:10
w_bands = 8
w_slope = 4
w_mass = 1
