# Wannier90 example: targeted refinement on VB1-3 / CB1-3, starting from the best protocol
[reference]
emin = -6
emax = 6

[band_path]
points_per_segment = 15

[fit]
objective = window
n_pairs = 1
budget = 3000
optimizer = cmaes
polish = nelder-mead
start_from = ../wannier90/Si_diamond_vasp_pbe/fitting/window-ga-basis

[objective]
band_weights = v1:10 v2:6 v3:3 c1:10 c2:6 c3:3
w_bands = 6
w_slope = 4
w_mass = 1
