# Common settings for the validation fits (run_validation.sh). The DFT folder
# and package are given on the command line for each example.
[reference]
emin = -6
emax = 6

[band_path]
points_per_segment = 15

[fit]
n_pairs = 1
budget = 300
optimizer = nelder-mead
gap_weight = 0.35
reg_weight = 0.04
