# Fe bcc, ferromagnetic PBE (VASP, ISPIN=2): metal, one fit per spin channel.
[reference]
dft_code = vasp
# Fermi level of the self-consistent run (scf/vasprun.xml); the band run's (5.929) is less reliable
fermi = 5.86385846
emin = -10
emax = 8

[band_path]
points_per_segment = 20
dimension = 3

[objective]
window_min = -9
window_max = 3
energy_scale = 1.5
far_weight = 0.15
w_frontier = 8
frontier_scale = 0.7
w_high_symmetry = 3
w_extrema = 2
w_position = 1
w_slope = 1

[fit]
objective = metal
budget = 8000
optimizer = cmaes
polish = nelder-mead
